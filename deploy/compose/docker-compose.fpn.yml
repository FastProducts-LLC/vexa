# fpn overlay — the FastProducts deployment profile over the stock v0.12 compose file.
#
# Usage (from deploy/compose/):
#   docker compose -p vexa-v012 -f docker-compose.yml -f docker-compose.fpn.yml --env-file .env up -d --wait
#
# What it changes:
#   * runtime runs the fork image too (C5: bearer-authenticated control plane + mount allowlist).
#   * meeting-api + gateway run the FastProducts-LLC/vexa fork images from GHCR (the fpn branch's
#     acts.v1 speak/config control-plane patch), pinned by FPN_VEXA_SHA (default: latest).
#   * meeting-api gets TTS_SERVICE_URL / TTS_SERVICE_TOKEN — threaded into voice-agent bot spawns
#     (the bot's tts-playback.ts reads TTS_SERVICE_URL / TTS_API_TOKEN from its container env).
#   * New internal-only `tts-cartesia` service: the OpenAI-compatible /v1/audio/speech shim over
#     the Cartesia TTS API (deploy/fpn/tts-cartesia).
#   * New internal-only `stt-hosted` service: the OpenAI-compatible /v1/audio/transcriptions shim
#     over hosted STT providers — Deepgram (default) or Groq (deploy/fpn/stt-hosted). The overlay
#     defaults TRANSCRIPTION_SERVICE_URL/TOKEN to it, so the separate deploy/transcription
#     CPU/GPU unit is no longer needed; setting TRANSCRIPTION_SERVICE_URL in .env still wins.
#   * gateway is ALSO attached to the external `fpn_backend` network (alias vexa-gateway) so the
#     taims stack reaches it without published ports. meeting-api is deliberately NOT: it trusts
#     gateway-injected identity headers, so only the gateway may reach it (see its service block).
#   * terminal / mcp / agent-api are disabled (profiles: ["disabled"]) — nothing in the retained
#     set depends on them (terminal was agent-api's only dependent).
#   * Every retained service gets mem_limit + pids_limit and bounded json-file logging.
#
# Env the overlay reads (set in deploy/compose/.env):
#   FPN_VEXA_SHA                 image tag for the three fork images (a fpn commit SHA; default latest)
#   TTS_SERVICE_URL              meeting-api -> bot TTS endpoint (default http://tts-cartesia:8080)
#   TTS_SERVICE_TOKEN            shared shim token (== TTS_SHIM_TOKEN; bots send it as X-API-Key)
#   TTS_SHIM_TOKEN               the same token, as required by the shim (401 otherwise)
#   CARTESIA_API_KEY             Cartesia API key
#   CARTESIA_VOICE_MAP_JSON      optional JSON map: request voice name -> Cartesia voice id
#   CARTESIA_DEFAULT_VOICE_ID    fallback Cartesia voice id
#   TRANSCRIPTION_SERVICE_URL    meeting-api -> bot STT endpoint (default http://stt-hosted:8080;
#                                leave unset to use the shim, or point at a self-hosted unit)
#   TRANSCRIPTION_SERVICE_TOKEN  bearer the bots send (defaults to STT_SHIM_TOKEN)
#   STT_SHIM_TOKEN               shared secret the stt-hosted shim requires (401 otherwise)
#   STT_PROVIDER                 "deepgram" (default) or "groq"
#   DEEPGRAM_API_KEY             Deepgram API key (STT_PROVIDER=deepgram)
#   DEEPGRAM_STT_MODEL           Deepgram model (default nova-3)
#   GROQ_API_KEY                 Groq API key (STT_PROVIDER=groq)
#   GROQ_STT_MODEL               Groq Whisper model (default whisper-large-v3-turbo)
#
# REQUIRED secrets (no defaults here — `compose up` refuses to start if any is unset/empty, and
# meeting-api additionally refuses to boot if one still holds the stock placeholder value):
#   ADMIN_TOKEN                  admin-api admin key + MeetingToken HS256 key (not "changeme")
#   INTERNAL_API_SECRET          gateway<->admin-api/meeting-api internal edge (not "vexa-internal-secret")
#   DB_PASSWORD                  Postgres password (not "postgres"; an EXISTING volume keeps its old
#                                password — ALTER ROLE it first, POSTGRES_PASSWORD only applies at initdb)
#   MINIO_SECRET_KEY             MinIO root password (not "vexa-secret-key")
#   RUNTIME_API_TOKEN            runtime control-plane bearer, shared by runtime + meeting-api
#                                (security finding C5; `openssl rand -hex 32`; not "vexa-runtime-dev-token")
#
# The external network must exist first: docker network create fpn_backend

# ${VAR:?} = no fail-open default: an unset/empty value aborts `docker compose up` (the stock file's
# `${VAR:-placeholder}` defaults are public values). meeting-api's DEV_MODE is pinned off so its boot
# preflight rejects any placeholder that is still set explicitly.
x-fpn-req:
  - &req-db-password DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in deploy/compose/.env}
  - &req-internal-secret INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set in deploy/compose/.env}
  - &req-runtime-token RUNTIME_API_TOKEN=${RUNTIME_API_TOKEN:?RUNTIME_API_TOKEN must be set in deploy/compose/.env}

x-fpn-logging: &fpn-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    mem_limit: 256m
    pids_limit: 128
    logging: *fpn-logging

  postgres:
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in deploy/compose/.env}
    mem_limit: 1g
    pids_limit: 256
    logging: *fpn-logging

  minio:
    environment:
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in deploy/compose/.env}
    mem_limit: 512m
    pids_limit: 128
    logging: *fpn-logging

  minio-init:
    environment:
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in deploy/compose/.env}
    mem_limit: 128m
    pids_limit: 64
    logging: *fpn-logging

  admin-api:
    environment:
      - *req-db-password
      - *req-internal-secret
      - ADMIN_API_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in deploy/compose/.env}
    mem_limit: 256m
    pids_limit: 128
    logging: *fpn-logging

  runtime:
    # C5: the fork's runtime image (control-plane bearer auth + server-side mount allowlist). The
    # stock vexaai/v012-runtime image has an UNAUTHENTICATED /workloads + /schedule over the host
    # docker socket — never run it here.
    image: ghcr.io/fastproducts-llc/vexa-runtime:${FPN_VEXA_SHA:-latest}
    pull_policy: missing
    environment:
      - *req-internal-secret
      - *req-runtime-token
      # No agent-api in fpn → no workload may declare ANY bind source (bots never mount anything).
      - RUNTIME_MOUNT_SOURCE_ALLOWLIST=
    mem_limit: 512m
    pids_limit: 256
    logging: *fpn-logging

  meeting-api:
    image: ghcr.io/fastproducts-llc/vexa-meeting-api:${FPN_VEXA_SHA:-latest}
    pull_policy: missing
    environment:
      - *req-db-password
      - *req-internal-secret
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in deploy/compose/.env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in deploy/compose/.env}
      # C5: runtime control-plane bearer (== the runtime's RUNTIME_API_TOKEN).
      - *req-runtime-token
      # Production: the boot preflight rejects stock placeholder secrets (never true in fpn).
      - DEV_MODE=false
      # Threaded by bot_spawn into voice-agent workload env as TTS_SERVICE_URL / TTS_API_TOKEN.
      - TTS_SERVICE_URL=${TTS_SERVICE_URL:-http://tts-cartesia:8080}
      - TTS_SERVICE_TOKEN=${TTS_SERVICE_TOKEN:-}
      # STT the spawned bots transcribe with — defaults to the stt-hosted shim below. An explicit
      # TRANSCRIPTION_SERVICE_URL in .env (e.g. a self-hosted deploy/transcription unit) wins.
      - TRANSCRIPTION_SERVICE_URL=${TRANSCRIPTION_SERVICE_URL:-http://stt-hosted:8080}
      - TRANSCRIPTION_SERVICE_TOKEN=${TRANSCRIPTION_SERVICE_TOKEN:-${STT_SHIM_TOKEN:-}}
    mem_limit: 512m
    pids_limit: 256
    logging: *fpn-logging
    # NOT on fpn_backend (trust boundary): meeting-api trusts the gateway-injected X-User-Id /
    # X-User-Workspaces headers and serves the unauthenticated bot/runtime callbacks
    # (/bots/internal/callback/lifecycle, /runtime/callback). On the shared fpn_backend network any
    # co-hosted app could forge X-User-Id and read/stop/speak into ANY tenant's meetings. External
    # consumers (taims) go through vexa-gateway with an X-API-Key; meeting-api stays on the base
    # compose's internal `vexa` network only.

  gateway:
    image: ghcr.io/fastproducts-llc/vexa-gateway:${FPN_VEXA_SHA:-latest}
    pull_policy: missing
    environment:
      - *req-internal-secret
    mem_limit: 256m
    pids_limit: 128
    logging: *fpn-logging
    networks:
      vexa: {}
      fpn_backend:
        aliases: [vexa-gateway]

  tts-cartesia:
    image: ghcr.io/fastproducts-llc/vexa-tts-cartesia:${FPN_VEXA_SHA:-latest}
    pull_policy: missing
    environment:
      - TTS_SHIM_TOKEN=${TTS_SHIM_TOKEN:-}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY:-}
      - CARTESIA_VERSION=${CARTESIA_VERSION:-2025-04-16}
      - CARTESIA_TTS_MODEL=${CARTESIA_TTS_MODEL:-sonic-3}
      - CARTESIA_VOICE_MAP_JSON=${CARTESIA_VOICE_MAP_JSON:-}
      - CARTESIA_DEFAULT_VOICE_ID=${CARTESIA_DEFAULT_VOICE_ID:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    # Non-root posture (the image's own USER is 10001:10001; `user:` pins it even if the image
    # tag ever regresses). No disk state: root fs read-only, tmpfs for Python's tempdir, all
    # capabilities dropped (port 8080 needs none), no setuid escalation.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    logging: *fpn-logging
    # Internal only: the spawned bots reach it over the WORKLOADS network (runtime attaches them to
    # ${COMPOSE_PROJECT_NAME}_bots via DOCKER_NETWORK — C4 split), meeting-api over `vexa`. No host
    # port, not on fpn_backend.
    networks: [vexa, bots]
    restart: unless-stopped

  stt-hosted:
    image: ghcr.io/fastproducts-llc/vexa-stt-hosted:${FPN_VEXA_SHA:-latest}
    pull_policy: missing
    environment:
      - STT_SHIM_TOKEN=${STT_SHIM_TOKEN:-}
      - STT_PROVIDER=${STT_PROVIDER:-deepgram}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - DEEPGRAM_STT_MODEL=${DEEPGRAM_STT_MODEL:-nova-3}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-whisper-large-v3-turbo}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    # Same non-root posture as tts-cartesia. The tmpfs on /tmp matters here: Starlette spools
    # multipart uploads larger than 1 MiB to the tempdir, and the bot's WAV windows sit right
    # around that size — with read_only and no tmpfs those requests would fail.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    logging: *fpn-logging
    # Internal only, same posture as tts-cartesia: bots reach it over the workloads network (C4).
    networks: [vexa, bots]
    restart: unless-stopped

  # ── disabled in the fpn deployment (profiles keep them out of `up`) ─────────────────────────────
  # terminal was the ONLY dependent of agent-api, so agent-api can be disabled with it.
  terminal:
    profiles: ["disabled"]

  mcp:
    profiles: ["disabled"]

  agent-api:
    profiles: ["disabled"]

networks:
  fpn_backend:
    external: true
