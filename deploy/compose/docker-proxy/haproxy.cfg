global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    # Image pulls can wait minutes for the daemon to send progress.
    timeout server 600s

frontend docker_api
    bind :2375

    acl method_get method GET
    acl method_post method POST
    acl method_delete method DELETE
    acl container_list path_reg -i ^(/v[0-9.]+)?/containers/json$
    acl container_create path_reg -i ^(/v[0-9.]+)?/containers/create$
    acl container_inspect path_reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/json$
    acl container_lifecycle path_reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/(start|stop|kill)$
    acl container_delete path_reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+$
    acl image_inspect path_reg -i ^(/v[0-9.]+)?/images/.+/json$
    acl image_pull path_reg -i ^(/v[0-9.]+)?/images/create$

    # DockerBackend.list_workload_containers
    http-request allow if method_get container_list
    # DockerBackend.start
    http-request allow if method_post container_create
    # DockerBackend.find and _exit_from_inspect
    http-request allow if method_get container_inspect
    # DockerBackend.start, terminate and kill
    http-request allow if method_post container_lifecycle
    # DockerBackend.cleanup and start (name-conflict cleanup)
    http-request allow if method_delete container_delete
    # DockerBackend._image_exists
    http-request allow if method_get image_inspect
    # DockerBackend.ensure_worker_image
    http-request allow if method_post image_pull
    http-request deny deny_status 403

    default_backend docker_socket

backend docker_socket
    server docker unix@/var/run/docker.sock
