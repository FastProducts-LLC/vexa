{{- if not .Values.secrets.existingSecretName }}
{{- /* No shipped defaults for the two stack secrets: a chart-rendered placeholder is a PUBLIC secret
       (admin-api auth + MeetingToken signing key; the internal service edge). Required, and the known
       published placeholder values are refused. Generate with: openssl rand -hex 32 */}}
{{- $adminToken := required "secrets.adminApiToken is required (or set secrets.existingSecretName) — generate one with: openssl rand -hex 32" .Values.secrets.adminApiToken }}
{{- $internalSecret := required "secrets.internalApiSecret is required (or set secrets.existingSecretName) — generate one with: openssl rand -hex 32" .Values.secrets.internalApiSecret }}
{{- $placeholders := list "changeme" "change_me" "dev-admin-token" "vexa-internal-secret" "lite-internal-secret" }}
{{- if has (lower (trim $adminToken)) $placeholders }}
{{- fail "secrets.adminApiToken is a published placeholder value — set a real secret (openssl rand -hex 32)" }}
{{- end }}
{{- if has (lower (trim $internalSecret)) $placeholders }}
{{- fail "secrets.internalApiSecret is a published placeholder value — set a real secret (openssl rand -hex 32)" }}
{{- end }}
{{- /* C5: the runtime control-plane bearer. Explicit value wins; else keep the one already in the
       cluster (so an upgrade never rotates it under running pods); else generate a random one. */}}
{{- $secretName := include "vexa.componentName" (list . "secrets") }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $prevRuntimeToken := (dig "data" "RUNTIME_API_TOKEN" "" $existing) | b64dec }}
{{- $runtimeApiToken := .Values.secrets.runtimeApiToken | default $prevRuntimeToken | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vexa.componentName" (list . "secrets") }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_API_TOKEN: {{ $adminToken | quote }}
  INTERNAL_API_SECRET: {{ $internalSecret | quote }}
  RUNTIME_API_TOKEN: {{ $runtimeApiToken | quote }}
  TRANSCRIPTION_SERVICE_TOKEN: {{ .Values.secrets.transcriptionServiceToken | quote }}
  VEXA_SERVICE_AUTHORITY_SECRET: {{ .Values.secrets.serviceAuthoritySecret | quote }}
  VEXA_SYSTEM_WEBHOOK_SECRET: {{ .Values.secrets.systemWebhookSecret | quote }}
  VEXA_DISPATCH_SIGNING_KEY: {{ .Values.secrets.dispatchSigningKey | default "dev-dispatch-signing-key" | quote }}
  NEXTAUTH_SECRET: {{ .Values.secrets.nextauthSecret | default "dev-nextauth-secret" | quote }}
  {{- if .Values.secrets.botApiKey }}
  VEXA_BOT_API_KEY: {{ .Values.secrets.botApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicAuthToken }}
  ANTHROPIC_AUTH_TOKEN: {{ .Values.secrets.anthropicAuthToken | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicBaseUrl }}
  ANTHROPIC_BASE_URL: {{ .Values.secrets.anthropicBaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.claudeCodeOauthToken }}
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.secrets.claudeCodeOauthToken | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.credentialsSecretName | default "postgres-credentials" }}
  labels:
    {{- include "vexa.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | default "postgres" | quote }}
{{- end }}
