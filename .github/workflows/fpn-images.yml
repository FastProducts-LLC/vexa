# fpn-images — build + publish the fpn overlay's four images to GHCR on every push to fpn.
#
#   ghcr.io/fastproducts-llc/vexa-meeting-api   (context: repo root — the Dockerfile vendors the
#                                                sealed contracts by path, same as upstream's
#                                                release-images matrix entry)
#   ghcr.io/fastproducts-llc/vexa-gateway       (context: core/gateway/services/gateway)
#   ghcr.io/fastproducts-llc/vexa-tts-cartesia  (context: deploy/fpn/tts-cartesia)
#   ghcr.io/fastproducts-llc/vexa-stt-hosted    (context: deploy/fpn/stt-hosted)
#
# Tags: :<commit sha> (immutable) + :latest (mutable pointer). The fpn compose overlay
# (deploy/compose/docker-compose.fpn.yml) pins by FPN_VEXA_SHA.
name: fpn-images

on:
  push:
    branches: [fpn]

concurrency:
  group: fpn-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fastproducts-llc

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Contexts mirror upstream's release-images matrix: meeting-api builds from the carve
          # root (its Dockerfile COPYs core/meetings/... + the sealed contracts by path); the
          # gateway builds from its own service dir.
          - name: vexa-meeting-api
            context: .
            dockerfile: core/meetings/services/meeting-api/Dockerfile
          - name: vexa-gateway
            context: core/gateway/services/gateway
            dockerfile: core/gateway/services/gateway/Dockerfile
          - name: vexa-tts-cartesia
            context: deploy/fpn/tts-cartesia
            dockerfile: deploy/fpn/tts-cartesia/Dockerfile
          - name: vexa-stt-hosted
            context: deploy/fpn/stt-hosted
            dockerfile: deploy/fpn/stt-hosted/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
